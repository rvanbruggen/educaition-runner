services:
  runner:
    build: .
    container_name: educaition-runner
    env_file: .env
    environment:
      - TZ=${TZ:-Europe/Brussels}
    ports:
      # Host port from RUNNER_PORT in .env (8080 is taken on the Docker host).
      - "${RUNNER_PORT:-8090}:8080"
    volumes:
      - ./data:/data
      - ./tasks:/tasks:ro
    restart: unless-stopped
    stop_grace_period: 60s
