# Geplande taken voor educaition.today
# cron:  5-velden cron in TZ (Europe/Brussels). Weekdag als naam (sun, mon…):
#        APScheduler telt 0 als maandag, niet als zondag.
# kind:  collect | articles | agent        (zie app/runner.py)
# mode:  off     — geplande runs worden overgeslagen (taak draait niet gepland)
#        shadow  — pipeline draait, maar publiceert niet: resultaat naar /review
#        auto    — publiceert zelf zodra de validatie slaagt
# max_turns: bovengrens op agent-iteraties (alleen kind: agent)

tasks:
  bronnen-verzamelen:
    name: "Bronnen verzamelen"
    kind: collect
    mode: auto
    cron: "15 */2 * * *"
    schedule_label: "elke 2 uur (:15)"   # de VRT-feed overspant soms maar ~5 uur
    interval_hours: 2
    grace_hours: 4

  artikelen-vlaanderen:
    name: "Artikelscan Vlaanderen"
    kind: articles
    mode: shadow          # fase 1: naast Cowork; na de vergelijking → auto
    cron: "8 5 * * *"
    schedule_label: "dagelijks om 05:08"
    interval_hours: 24
    grace_hours: 8

  # --- v1-agenttaken (Claude Agent SDK); worden in fase 2-4 pipelines ---
  digest-vlaanderen:
    name: "Samengevat (Vlaanderen)"
    kind: agent
    mode: auto
    prompt: digest-vlaanderen.md
    cron: "7 18 * * sun"
    schedule_label: "zondag om 18:07"
    interval_hours: 168
    grace_hours: 12
    max_turns: 100

  digest-internationaal:
    name: "Internationaal samengevat"
    kind: agent
    mode: auto
    prompt: digest-internationaal.md
    cron: "30 18 * * sun"
    schedule_label: "zondag om 18:30"
    interval_hours: 168
    grace_hours: 12
    max_turns: 150

  faq-discussie-onderhoud:
    name: "FAQ & Ter discussie onderhoud"
    kind: agent
    mode: auto
    prompt: faq-discussie-onderhoud.md
    cron: "20 19 * * sun"
    schedule_label: "zondag om 19:20"
    interval_hours: 168
    grace_hours: 12
    max_turns: 100
