<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EducAItion logo: een open boek waaruit een neuraal netwerk groeit">
  <defs>
    <linearGradient id="ai" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- open boek -->
  <path d="M32 52 C26 46.5 16 45.5 7 47.5 L7 23.5 C16 21.5 26 22.5 32 28
           C38 22.5 48 21.5 57 23.5 L57 47.5 C48 45.5 38 46.5 32 52 Z"
        fill="none" stroke="#232946" stroke-width="3" stroke-linejoin="round"/>
  <path d="M32 28 L32 52" stroke="#232946" stroke-width="3" stroke-linecap="round"/>
  <!-- linkerpagina: tekstlijnen (menselijke kennis) -->
  <path d="M13 30 C19 29 25 30 28 32.5 M13 37 C19 36 25 37 28 39.5"
        fill="none" stroke="#232946" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <!-- rechterpagina: datalijnen (digitale kennis) -->
  <path d="M36 32.5 C39 30 45 29 51 30 M36 39.5 C39 37 45 36 51 37"
        fill="none" stroke="url(#ai)" stroke-width="1.8" stroke-linecap="round"
        stroke-dasharray="0.1 3.6" opacity="0.85"/>
  <!-- neuraal netwerk dat uit het boek groeit -->
  <path d="M32 26 L23 14 M32 26 L41 12 M32 26 L32 7 M23 14 L32 7 M41 12 L32 7"
        stroke="url(#ai)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <circle cx="23" cy="14" r="3.4" fill="url(#ai)"/>
  <circle cx="41" cy="12" r="3.4" fill="url(#ai)"/>
  <circle cx="32" cy="7" r="3.8" fill="url(#ai)"/>
  <circle cx="32" cy="26" r="3" fill="#232946"/>
</svg>
